spring:
  application:
    name: CinebhApp
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
server:
  port: 8080
springdoc:
  api-docs:
    path: /api-docs
config:
  secret-key: ${JWT_KEY}