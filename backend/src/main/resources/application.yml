spring:
  application:
    name: CinebhApp
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
  session:
    jdbc:
      initialize-schema: always
server:
  port: 8080
  servlet:
    session:
      timeout: 5m
      tracking-modes: cookie
springdoc:
  api-docs:
    path: /api-docs
config:
  secret-key: ${JWT_KEY}